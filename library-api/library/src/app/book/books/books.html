

<div class="page">
  <div class="container py-4">
    <div class="topbar card p-3 mb-3">
      <div class="d-flex flex-column flex-md-row gap-2 align-items-md-center">

        <div class="flex-grow-1 position-relative">
          <input class="form-control form-control-lg"
                 placeholder="Kitap Ara"
                 [(ngModel)]="searchTerm">
          <button *ngIf="searchTerm"
                  class="btn btn-sm btn-light clear-btn"
                  type="button"
                  (click)="clearSearch()">✕</button>
        </div>

        <a class="btn btn-primary btn-lg px-4" routerLink="/bookregister">
          Kitap Kayıt
        </a>
		<a class="btn btn-primary btn-lg px-4" routerLink="/login">
		  Çıkış Yap
		</a>
		
      </div>

      <div class="d-flex justify-content-between mt-2 small text-muted">
        <span>{{ filteredBooks.length }} kitap gösteriliyor</span>
      </div>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3" *ngIf="filteredBooks.length">
      <div class="col" *ngFor="let b of filteredBooks; trackBy: trackById">
        <div class="card book-card h-100">
			<div class="ratio ratio-16x9">
			  <img
			    class="card-img-top object-fit-cover"
			    src="https://www.yeniasya.com.tr/Sites/YeniAsya/Upload/images/Content/2018/03/30/kitaplar-696x435.jpg"
			    alt="cover"
			  />
			</div>



          <div class="card-body d-flex flex-column">
            <h3 class="card-title mb-1 text-center"  >{{ b.bookName }}</h3>
            <div class="text-muted mb-2">{{ b.author }}</div>

            <div class="small text-muted mb-2">
              <span *ngIf="b.pageCount"> 📑 {{ b.pageCount }}</span>
              <span *ngIf="b.category" class="ms-2 text-right"> {{b.category }}</span>
            </div>

			<p class="desc mb-3">📅 {{ b.registerDate || '-' }}</p>


            <div class="mt-auto d-flex gap-2">
              <!-- Detay: books klasörü üzerinden -->
              <a class="btn btn-outline-secondary w-100"
                 [routerLink]="['/books', b.id]">
                Detay
              </a>

              <!--  Sil -->
              <button class="btn btn-outline-danger"
                      type="button"
                      (click)="deleteBook(b.id)"
                      title="Sil">🗑</button>
            </div>
          </div>

        </div>
      </div>
    </div>

    <div class="card p-4 text-center" *ngIf="!filteredBooks.length">
      Sonuç bulunamadı.
    </div>

  </div>
</div>
